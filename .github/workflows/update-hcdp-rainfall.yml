name: Update HCDP monthly rainfall

on:
  schedule:
    # Retry weekly so a month published after the 15th is not missed.
    - cron: '23 18 * * 1'
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYY-MM month for isolated verify_only test; leave blank for archive sync'
        required: false
      verify_only:
        description: 'Validate an API download in isolation; do not change website files or open a PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-hcdp.txt
      - run: python -m pip install -r scripts/requirements-hcdp.txt
      - name: Test raster conversion and archive safety
        run: python -m unittest discover -s tests -p 'test_*hcdp_rainfall*.py' -v
      - name: Download and validate HCDP rainfall
        env:
          HCDP_API_TOKEN: ${{ secrets.HCDP_API_TOKEN }}
          REQUESTED_MONTH: ${{ inputs.month }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if [ "$VERIFY_ONLY" = "true" ]; then
            if [ -z "$REQUESTED_MONTH" ]; then
              echo 'Verification requires a YYYY-MM month.' >&2
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/hcdp-rainfall-verified"
            python scripts/update_hcdp_rainfall.py --month "$REQUESTED_MONTH" --require-data --output-dir "$RUNNER_TEMP/hcdp-rainfall-verified"
          else
            if [ -n "$REQUESTED_MONTH" ]; then
              echo 'The month input is only for isolated verify_only tests.' >&2
              exit 1
            fi
            python scripts/sync_hcdp_rainfall_history.py --months 24
          fi
      - name: Upload isolated validated files
        if: ${{ inputs.verify_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: hcdp-rainfall-verified
          path: ${{ runner.temp }}/hcdp-rainfall-verified/rainfall-*
          retention-days: 1
          if-no-files-found: error
      - name: Open review PR for validated data
        if: ${{ inputs.verify_only != true }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/hcdp-monthly-rainfall-data
          delete-branch: true
          add-paths: |
            assets/data/rainfall-values.png
            assets/data/rainfall-overlay.png
            assets/data/rainfall-metadata.json
            assets/data/rainfall-months.json
            assets/data/rainfall-monthly/
          commit-message: Update validated HCDP monthly rainfall
          title: Update HCDP monthly rainfall data
          body: |
            Automated HCDP statewide monthly rainfall update.
            The raster and all website assets passed the conversion checks.
            Please review the metadata and map before merging. This workflow does not deploy.
